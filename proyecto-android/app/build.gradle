plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.optimo.chat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.optimo.chat'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.0.1'
    }

    // Misma mecanica de firma que Optimo: el workflow de Fusion genera apk-build/debug.keystore
    // la primera vez que compila en el repositorio de ESTE proyecto (firma propia, estable entre builds).
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Sin dependencias: solo APIs del sistema (Keystore, SSL, sockets, ConnectivityManager).
dependencies {
}
